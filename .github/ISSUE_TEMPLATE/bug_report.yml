name: Bug report
description: Report a reproducible problem without private Telegram data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API hashes, login codes, session files, phone numbers, or private message content."
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
