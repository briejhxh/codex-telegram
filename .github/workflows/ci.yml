name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Doctor smoke test
        env:
          TG_API_ID: "1"
          TG_API_HASH: ci-placeholder-not-a-secret
          TG_CONFIG_DIR: ${{ runner.temp }}/codex-telegram-doctor
        run: pnpm run doctor
      - name: Validate plugin manifest
        run: pnpm run plugin:validate
